
name: SecureTask CI Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: securetask-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------
  # 1. BUILD AND TEST
  # --------------------------------------------------

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false

      - name: Display Versions
        run: |
          node --version
          npm --version

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

  # --------------------------------------------------
  # 2. GITLEAKS - SECRET SCANNING
  # --------------------------------------------------

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Scan Repository for Secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------
  # 3. TRIVY - FILESYSTEM SECURITY SCANNING
  # --------------------------------------------------

  security-checks:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    needs: gitleaks

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Trivy Filesystem Scan
        run: |
          trivy fs \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --format json \
            --output fs-report.json \
            .

      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trivy-filesystem-report
          path: fs-report.json
          if-no-files-found: warn
          retention-days: 7



  # --------------------------------------------------
  # 4. NPM AUDIT - DEPENDENCY VULNERABILITY SCANNING
  # --------------------------------------------------

  npm-audit:
    name: NPM Dependency Audit
    runs-on: ubuntu-latest
    needs: security-checks

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Scan Dependencies
        run: |
          npm audit --audit-level=high --json > npm-audit-report.json

      - name: Upload NPM Audit Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          if-no-files-found: warn
          retention-days: 7

  # --------------------------------------------------
  # 5. SEMGREP - STATIC APPLICATION SECURITY TESTING
  # --------------------------------------------------

  semgrep:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep
      # << I found • Findings: 15 (15 blocking)• Rules run: 240 • Targets scanned: 10>>>
      - name: Run Semgrep SAST
        run: |
          semgrep scan \
            --config auto \
            --error \
            --json \
            --output semgrep-report.json \
            .

      - name: Upload Semgrep Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semgrep-sast-report
          path: semgrep-report.json
          if-no-files-found: warn
          retention-days: 7
