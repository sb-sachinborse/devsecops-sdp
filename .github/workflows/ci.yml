
name: SecureTask CI Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: securetask-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------
  # 1. BUILD AND TEST
  # --------------------------------------------------

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false

      - name: Display Versions
        run: |
          node --version
          npm --version

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

  # --------------------------------------------------
  # 2. GITLEAKS - SECRET SCANNING
  # --------------------------------------------------

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Scan Repository for Secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------
  # 3. TRIVY - FILESYSTEM SECURITY SCANNING
  # --------------------------------------------------

  security-checks:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    needs: gitleaks

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Trivy Filesystem Scan
        run: |
          trivy fs \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --format json \
            --output fs-report.json \
            .

      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trivy-filesystem-report
          path: fs-report.json
          if-no-files-found: warn
          retention-days: 7



  # --------------------------------------------------
  # 4. NPM AUDIT - DEPENDENCY VULNERABILITY SCANNING
  # --------------------------------------------------

  npm-audit:
    name: NPM Dependency Audit
    runs-on: ubuntu-latest
    needs: security-checks

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Scan Dependencies
        run: |
          npm audit --audit-level=high --json > npm-audit-report.json

      - name: Upload NPM Audit Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          if-no-files-found: warn
          retention-days: 7

  # --------------------------------------------------
  # 5. SEMGREP - STATIC APPLICATION SECURITY TESTING
  # --------------------------------------------------

  semgrep:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep
      # << I found • Findings: 15 (15 blocking)• Rules run: 240 • Targets scanned: 10>>>
      - name: Run Semgrep SAST
        run: |
          semgrep scan \
            --config auto \
            --error \
            --json \
            --output semgrep-report.json \
            .

      - name: Upload Semgrep Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semgrep-sast-report
          path: semgrep-report.json
          if-no-files-found: warn
          retention-days: 7
      # - name: Run Semgrep SAST
      #   run: |
      #     semgrep scan \
      #       --config auto \
      #       --json \
      #       --output semgrep-report.json \
      #       .

      # - name: Display Semgrep Findings
      #   if: always()
      #   run: |
      #     if [ -f semgrep-report.json ]; then
      #       python -m json.tool semgrep-report.json
      #     fi

      # - name: Upload Semgrep Report
      #   if: always()
      #   uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      #   with:
      #     name: semgrep-sast-report
      #     path: semgrep-report.json
      #     if-no-files-found: warn
      #     retention-days: 7
  # --------------------------------------------------
  # 6. GITHUB CODEQL - CODE SECURITY ANALYSIS
  # --------------------------------------------------

  codeql:
    name: GitHub CodeQL Analysis
    runs-on: ubuntu-latest
    needs: security-checks

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          category: "/language:javascript-typescript"

  # --------------------------------------------------
  # 7. SONARQUBE - CODE QUALITY AND SECURITY ANALYSIS
  # --------------------------------------------------

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: 
        - build-and-test
        - gitleaks
        - security-checks
        - npm-audit
        - codeql

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=securetask
            -Dsonar.sources=src
            -Dsonar.qualitygate.wait=true

  # --------------------------------------------------
  # 7. qualtiy gate
  # --------------------------------------------------

  quality-gate:
    name: Security Quality Gate
    runs-on: ubuntu-latest

    if: always()

    needs:
      - build-and-test
      - gitleaks
      - security-checks
      - npm-audit
      - semgrep
      - codeql
      - sonarqube

    steps:
      - name: Check results
        run: |
          echo "Checking pipeline results..."

          if [[ "${{ needs.build-and-test.result }}" != "success" ||
                "${{ needs.gitleaks.result }}" != "success" ||
                "${{ needs.security-checks.result }}" != "success" ||
                "${{ needs.npm-audit.result }}" != "success" ||
                "${{ needs.semgrep.result }}" != "success" ||
                "${{ needs.codeql.result }}" != "success" ||
                "${{ needs.sonarqube.result }}" != "success" ]]; then
            echo "Security quality gate failed!"
            exit 1
          fi

          echo "All checks passed!"

  # --------------------------------------------------
  # 7. Docker Build, Security Scan, SBOM & Push
  # --------------------------------------------------
 
  docker-release:
    name: Docker Build, Security Scan, SBOM & Push
    runs-on: ubuntu-latest

    needs:
      - build-and-test
      - gitleaks
      - security-checks
      - npm-audit
      - codeql
      #- sonarqube
      # Add security-quality-gate here too if this is a separate job
      # in your workflow.

    permissions:
      contents: read

    env:
      IMAGE_NAME: securetask
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      # 1. Checkout
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 2. Validate Docker Hub configuration
      - name: Validate Docker Hub configuration
        shell: bash
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error::DOCKERHUB_USERNAME secret is missing"
            exit 1
          fi

          if [[ "$DOCKERHUB_USERNAME" =~ [[:space:]] ]]; then
            echo "::error::Docker Hub username contains whitespace"
            exit 1
          fi

          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::DOCKERHUB_TOKEN secret is missing"
            exit 1
          fi

          echo "Docker Hub configuration validation passed"

      # 3. Build image
      - name: Build Docker image
        shell: bash
        run: |
          IMAGE="${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${GITHUB_SHA}"
          echo "Building Docker image"
          docker build --pull --tag "$IMAGE" .

      # 4. Install Trivy
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy
          trivy --version

      # 5. Generate Trivy report
      - name: Generate Trivy image report
        run: |
          trivy image \
            --scanners vuln \
            --format json \
            --output trivy-image-report.json \
            "${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${GITHUB_SHA}"

      # 6. Vulnerability gate
      - name: Trivy vulnerability gate
        run: |
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${GITHUB_SHA}"

      # 7. Install Syft
      - name: Install Syft
        run: |
          curl -sSfL https://get.anchore.io/syft \
            | sudo sh -s -- -b /usr/local/bin
          syft version

      # 8. Generate SBOM
      - name: Generate SBOM
        run: |
          syft "${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${GITHUB_SHA}" \
            -o spdx-json=securetask-sbom.spdx.json \
            -o cyclonedx-json=securetask-sbom.cyclonedx.json

      # 9. Upload reports
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: securetask-security-reports
          path: |
            trivy-image-report.json
            securetask-sbom.spdx.json
            securetask-sbom.cyclonedx.json
          if-no-files-found: warn
          retention-days: 14

      # 10. Docker Hub login
      - name: Login to Docker Hub
        if: success() && github.event_name != 'pull_request'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login \
            --username "$DOCKERHUB_USERNAME" \
            --password-stdin

      # 11. Push versioned image
      - name: Push versioned image
        if: success() && github.event_name != 'pull_request'
        run: |
          docker push \
            "${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${GITHUB_SHA}"

      # 12. Push latest only from main
      - name: Tag and push latest
        if: success() && github.ref == 'refs/heads/main'
        run: |
          docker tag \
            "${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${GITHUB_SHA}" \
            "${DOCKERHUB_USERNAME}/${IMAGE_NAME}:latest"

          docker push "${DOCKERHUB_USERNAME}/${IMAGE_NAME}:latest"

      # 13. Logout
      - name: Logout from Docker Hub
        if: always() && github.event_name != 'pull_request'
        run: docker logout

