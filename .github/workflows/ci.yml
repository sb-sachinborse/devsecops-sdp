      #   run: |
      #     semgrep scan \
      #       --config auto \
      #       --json \
      #       --output semgrep-report.json \
      #       .

      # - name: Display Semgrep Findings
      #   if: always()
      #   run: |
      #     if [ -f semgrep-report.json ]; then
      #       python -m json.tool semgrep-report.json
      #     fi

      # - name: Upload Semgrep Report
      #   if: always()
      #   uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      #   with:
      #     name: semgrep-sast-report
      #     path: semgrep-report.json
      #     if-no-files-found: warn
      #     retention-days: 7
  # --------------------------------------------------
  # 6. GITHUB CODEQL - CODE SECURITY ANALYSIS
  # --------------------------------------------------

  codeql:
    name: GitHub CodeQL Analysis
    runs-on: ubuntu-latest
    needs: security-checks

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          category: "/language:javascript-typescript"

  # --------------------------------------------------
  # 7. SONARQUBE - CODE QUALITY AND SECURITY ANALYSIS
  # --------------------------------------------------

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: 
        - build-and-test
        - gitleaks
        - security-checks
        - npm-audit
        - codeql

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=securetask
            -Dsonar.sources=src
            -Dsonar.qualitygate.wait=true
